name: weather_app
description: A beautiful Flutter weather app with animated UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests for real weather API (optional)
  http: ^1.1.0

  # Lottie animations
  lottie: ^2.7.0

  # Shared preferences for caching
  shared_preferences: ^2.2.2

  # Geolocator for device location
  geolocator: ^10.1.0

  # Intl for date formatting
  intl: ^0.18.1

  # Cupertino icons
  cupertino_icons: ^1.0.6

  # Google fonts for beautiful typography
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
